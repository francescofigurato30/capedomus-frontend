<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capè Domus | Visita San Lucido</title>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <!-- FontAwesome per le icone e WhatsApp -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --primary-blue: #0a3d62; 
            --text-blue: #1e3799; 
            --glass-bg: rgba(255, 255, 255, 0.7); 
            --glass-border: rgba(255, 255, 255, 0.8);
        }
        
        body { 
            font-family: 'Lora', serif; 
            color: var(--text-blue); 
            margin: 0; padding: 0; line-height: 1.7; scroll-behavior: smooth;
            background: url('https://images.unsplash.com/photo-1499678329028-101435549a4e?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed; 
            background-size: cover;
        }

        h1, h2, h3, h4 {
            font-family: 'Playfair Display', serif;
            color: var(--primary-blue);
        }
        
        /* Effetto Vetro Generico */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px rgba(10, 61, 98, 0.15);
            border-radius: 16px;
        }

        /* Navbar */
        nav { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 15px 30px; position: sticky; top: 10px; z-index: 100; 
            margin: 0 20px; flex-wrap: wrap; gap: 15px;
        }
        
        .brand-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            height: 45px;
            width: auto;
            object-fit: contain;
        }

        .brand-title-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Colonne classiche stilizzate ed eleganti */
        .column-icon {
            font-size: 1.4em;
            color: var(--primary-blue);
            opacity: 0.9;
        }

        .brand-title-wrapper h2 { 
            margin: 0; letter-spacing: 2px; text-transform: uppercase; font-size: 1.2em; font-weight: 700; white-space: nowrap;
        }

        .nav-links { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
        nav a { 
            text-decoration: none; color: var(--primary-blue); font-weight: 600; 
            text-transform: uppercase; font-size: 0.8em; letter-spacing: 1px; transition: 0.3s; 
        }
        nav a:hover { opacity: 0.7; }

        /* Widget Traduzione Google */
        #google_translate_element { display: inline-block; }
        .goog-te-combo {
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid var(--primary-blue);
            background: rgba(255, 255, 255, 0.9);
            color: var(--primary-blue);
            font-family: 'Lora', serif;
            font-size: 0.8em;
            cursor: pointer;
        }
        .goog-te-banner-frame { display: none !important; }
        body { top: 0 !important; }
        
        /* Hero */
        .hero { 
            height: 80vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 0 20px;
        }
        .hero-title-container {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .hero-column {
            font-size: 2.8em;
            color: white;
            text-shadow: 0 3px 10px rgba(10, 61, 98, 0.8);
        }
        .hero h1 { 
            font-size: 4em; margin: 0; letter-spacing: 4px; text-transform: uppercase; 
            color: white; text-shadow: 0 4px 15px rgba(10, 61, 98, 0.8); 
        }
        .hero p { 
            font-size: 1.4em; font-style: italic; color: white; text-shadow: 0 2px 10px rgba(10, 61, 98, 0.8); 
        }
        
        /* Sezioni Generiche */
        .section { padding: 60px 20px; max-width: 1200px; margin: 30px auto; }
        .section-title { text-align: center; font-size: 2.8em; margin-bottom: 15px; font-weight: 700; }
