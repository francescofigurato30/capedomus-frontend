<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capè Domus | Visita San Lucido</title>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --brand-brown: #7b6858; 
            --brand-sand: #d4c5b9;
            --sea-blue: #4aa0df;
            --text-dark: #4a3b32;
            --glass-bg: rgba(255, 255, 255, 0.90); 
            --glass-border: rgba(212, 197, 185, 0.7);
        }
        
        body { 
            font-family: 'Lora', serif; 
            color: var(--text-dark); 
            margin: 0; padding: 0; line-height: 1.7; scroll-behavior: smooth;
            background: linear-gradient(rgba(10, 30, 45, 0.75), rgba(70, 58, 48, 0.85)), url('http://calabriastraordinaria.it/storage/images/12444/CS-San-Lucido-Paesaggio-Panorama-Mare-4%5BLR-13-2023%5D.JPG') no-repeat center center fixed; 
            background-size: cover;
            min-height: 100vh;
        }

        h1, h2, h3, h4 {
            font-family: 'Playfair Display', serif;
            color: var(--brand-brown);
        }
        
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
            border-radius: 16px;
        }

        nav { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 15px 30px; position: sticky; top: 10px; z-index: 100; 
            margin: 0 20px; flex-wrap: wrap; gap: 15px;
        }
        
        .brand-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .brand-logo {
            height: 60px; 
            width: auto;
            object-fit: contain;
            border-radius: 6px;
        }

        .brand-title-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-column {
            width: 18px;
            height: 50px;
            fill: var(--brand-brown);
            opacity: 0.95;
        }

        .brand-title-wrapper h2 { 
            margin: 0; letter-spacing: 2px; text-transform: uppercase; font-size: 1.1em; font-weight: 700; white-space: nowrap; color: var(--brand-brown);
        }

        .nav-links { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
        nav a { 
            text-decoration: none; color: var(--brand-brown); font-weight: 600; 
            text-transform: uppercase; font-size: 0.85em; letter-spacing: 1px; transition: 0.3s; 
        }
        nav a:hover { color: var(--sea-blue); }
        
        .hero { 
            height: 75vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 0 20px;
        }
        .hero-title-container {
            display: flex;
            align-items: center;
            gap: 25px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .hero-column {
            width: 30px;
            height: 85px;
            fill: var(--brand-brown);
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.8));
        }
        .hero h1 { 
            font-size: 4.2em; margin: 0; letter-spacing: 4px; text-transform: uppercase; 
            color: #ffffff; text-shadow: 0 4px 20px rgba(0, 0, 0, 0.8); 
        }
        .hero p { 
            font-size: 1.4em; font-style: italic; color: #ffffff; text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8); 
        }
        
        .section { padding: 60px 20px; max-width: 1200px; margin: 30px auto; }
        .section-title { text-align: center; font-size: 2.8em; margin-bottom: 15px; font-weight: 700; color: var(--brand-brown); }
        .section-subtitle { text-align: center; font-size: 1.1em; margin-bottom: 40px; max-width: 800px; margin-left: auto; margin-right: auto; font-weight: 600; color: var(--text-dark); }
        
        .history-layout { display: flex; gap: 30px; align-items: stretch; margin-top: 20px; }
        .history-text { flex: 1; padding: 35px; font-size: 1.05em; font-weight: 500; text-align: justify; }
        .history-text h3 { font-size: 1.6em; margin-top: 0; margin-bottom: 15px; color: var(--brand-brown); }
        
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
        .event-card { padding: 25px 20px; transition: transform 0.3s; display: flex; flex-direction: column; }
        .event-card:hover { transform: translateY(-8px); }
        .event-content { display: flex; flex-direction: column; }
        .event-date { color: var(--sea-blue); font-weight: 700; font-size: 0.8em; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        .event-title { font-size: 1.25em; margin: 0 0 8px 0; font-weight: 700; color: var(--brand-brown); }
        .event-desc { font-size: 0.9em; font-weight: 500; }

        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; margin-top: 30px; }
        .activity-card { text-align: center; padding: 40px 25px; transition: 0.3s; }
        .activity-card:hover { transform: translateY(-5px); }
        .activity-card h3 { font-size: 1.4em; margin-bottom: 12px; color: var(--brand-brown); }
        .activity-card p { font-size: 0.95em; font-weight: 500; }

        .newsletter-box {
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
        }
        .newsletter-form {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .newsletter-input {
            padding: 12px 20px;
            border-radius: 8px;
            border: 1px solid var(--brand-brown);
            flex: 1;
            min-width: 250px;
            font-family: 'Lora', serif;
            outline: none;
        }
        .newsletter-btn {
            padding: 12px 25px;
            background-color: var(--brand-brown);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.3s;
        }
        .newsletter-btn:hover {
            background-color: var(--sea-blue);
        }

        .whatsapp-float {
            position: fixed; bottom: 30px; right: 30px; background-color: var(--sea-blue); color: white;
            width: 60px; height: 60px; border-radius: 50%; text-align: center; font-size: 32px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3); z-index: 1000; display: flex;
            align-items: center; justify-content: center; text-decoration: none; transition: transform 0.3s ease;
        }
        .whatsapp-float:hover { transform: scale(1.1); background-color: var(--brand-brown); }

        footer { 
            text-align: center; 
            padding: 45px 20px; 
            margin: 50px 20px 20px 20px; 
            color: var(--text-dark); 
        }
        footer h3 { 
            letter-spacing: 2px; 
            margin-bottom: 10px; 
            font-size: 1.6em; 
            color: var(--brand-brown); 
        }
        footer p {
            color: var(--text-dark);
            font-weight: 500;
        }
        
        @media (max-width: 1024px) { 
            .grid-4, .grid-3 { grid-template-columns: repeat(2, 1fr); } 
            .history-layout { flex-direction: column; }
        }
