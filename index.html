<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capè Domus | Visita San Lucido</title>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <!-- FontAwesome per l'icona di WhatsApp -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --primary-blue: #0a3d62; 
            --text-blue: #1e3799; 
            --glass-bg: rgba(255, 255, 255, 0.65); 
            --glass-border: rgba(255, 255, 255, 0.6);
        }
        
        body { 
            font-family: 'Lora', serif; 
            color: var(--text-blue); 
            margin: 0; padding: 0; line-height: 1.7; scroll-behavior: smooth;
            background: url('https://images.unsplash.com/photo-1499678329028-101435549a4e?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed; 
            background-size: cover;
        }

        h1, h2, h3, h4 {
            font-family: 'Playfair Display', serif;
            color: var(--primary-blue);
        }
        
        /* Effetto Vetro Generico */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px rgba(10, 61, 98, 0.15);
            border-radius: 16px;
        }

        /* Navbar con Logo e Colonne Eleganti */
        nav { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 15px 40px; position: sticky; top: 10px; z-index: 100; 
            margin: 0 20px; flex-wrap: wrap; gap: 15px;
        }
        
        .brand-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .brand-logo {
            height: 50px;
            width: auto;
            object-fit: contain;
        }

        .brand-title-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Disegno SVG di una colonna classica elegante e dettagliata */
        .classic-column {
            width: 14px;
            height: 38px;
            fill: var(--primary-blue);
            opacity: 0.9;
        }

        .brand-title-wrapper h2 { 
            margin: 0; letter-spacing: 2px; text-transform: uppercase; font-size: 1.3em; font-weight: 700; white-space: nowrap;
        }

        .nav-links { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
        nav a { 
            text-decoration: none; color: var(--primary-blue); font-weight: 600; 
            text-transform: uppercase; font-size: 0.85em; letter-spacing: 1px; transition: 0.3s; 
        }
        nav a:hover { opacity: 0.7; }

        /* Widget Traduzione Google */
        #google_translate_element { display: inline-block; }
        .goog-te-combo {
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid var(--primary-blue);
            background: rgba(255, 255, 255, 0.9);
            color: var(--primary-blue);
            font-family: 'Lora', serif;
            font-size: 0.85em;
            cursor: pointer;
        }
        .goog-te-banner-frame { display: none !important; }
        body { top: 0 !important; }
        
        /* Hero con Colonne ai lati del titolo principale */
        .hero { 
            height: 80vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; 
        }
        .hero-title-container {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 10px;
        }
        .hero-column {
            width: 28px;
            height: 75px;
            fill: white;
            filter: drop-shadow(0 2px 8px rgba(10, 61, 98, 0.7));
        }
        .hero h1 { 
            font-size: 4.5em; margin: 0; letter-spacing: 4px; text-transform: uppercase; 
            color: white; text-shadow: 0 4px 15px rgba(10, 61, 98, 0.7); 
        }
        .hero p { 
            font-size: 1.5em; font-style: italic; color: white; text-shadow: 0 2px 10px rgba(10, 61, 98, 0.7); 
        }
        
        /* Sezioni Generiche */
        .section { padding: 70px 30px; max-width: 1200px; margin: 30px auto; }
        .section-title { text-align: center; font-size: 3em; margin-bottom: 20px; font-weight: 700; }
        .section-subtitle { text-align: center; font-size: 1.15em; margin-bottom: 45px; max-width: 800px; margin-left: auto; margin-right: auto; font-weight: 600; }
        
        /* Layout Storia e Cilla */
        .history-layout { display: flex; gap: 40px; align-items: stretch; margin-top: 20px; }
        .history-text { flex: 1; padding: 35px; font-size: 1.1em; font-weight: 500; text-align: justify; }
        .history-text h3 { font-size: 1.7em; margin-top: 0; margin-bottom: 15px; }
        .history-img { flex: 1; border-radius: 16px; overflow: hidden; min-height: 350px; }
        .history-img img { width: 100%; height: 100%; object-fit: cover; }

        /* Griglia 4 Colonne (Sagre) */
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
        .event-card { overflow: hidden; transition: transform 0.3s; display: flex; flex-direction: column; }
        .event-card:hover { transform: translateY(-8px); }
        .event-card img { width: 100%; height: 180px; object-fit: cover; border-bottom: 1px solid var(--glass-border); }
        .event-content { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; }
        .event-date { color: var(--primary-blue); font-weight: 700; font-size: 0.85em; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        .event-title { font-size: 1.3em; margin: 0 0 8px 0; font-weight: 700; }
        .event-desc { font-size: 0.95em; font-weight: 500; flex-grow: 1; }

        /* Griglia 3 Colonne (Esperienze) */
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; margin-top: 30px; }
        .activity-card { text-align: center; padding: 35px 20px; transition: 0.3s; }
        .activity-card:hover { transform: translateY(-5px); }
        .activity-card img { width: 200px; height: 200px; object-fit: cover; border-radius: 50%; border: 6px solid rgba(255,255,255,0.8); box-shadow: 0 10px 25px rgba(10, 61, 98, 0.15); margin-bottom: 20px; }
        .activity-card h3 { font-size: 1.5em; margin-bottom: 12px; }
        .activity-card p { font-size: 1em; font-weight: 500; }

        /* Pulsante WhatsApp Fluttuante */
        .whatsapp-float {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color: #25d366;
            color: white;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            text-align: center;
            font-size: 35px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: transform 0.3s ease;
        }
        .whatsapp-float:hover {
            transform: scale(1.1);
        }

        /* Footer */
        footer { text-align: center; padding: 40px 20px; margin: 50px 20px 20px 20px; }
        footer h3 { letter-spacing: 2px; margin-bottom: 10px; font-size: 1.8em; }
        
        @media (max-width: 1024px) { 
            .grid-4, .grid-3 { grid-template-columns: repeat(2, 1fr); } 
            .history-layout { flex-direction: column; }
        }
        @media (max-width: 768px) { 
            .grid-4, .grid-3 { grid-template-columns: 1fr; } 
            nav { flex-direction: column; gap: 15px; border-radius: 12px; padding: 20px; } 
            .hero h1 { font-size: 2.8em; }
            .hero-column { width: 18px; height: 45px; }
            .brand-container { flex-direction: column; text-align: center; }
        }
    </style>
</head>
