<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capè Domus | Visita San Lucido</title>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --primary-blue: #0a3d62; 
            --text-blue: #1e3799; 
            --glass-bg: rgba(255, 255, 255, 0.85); 
            --glass-border: rgba(255, 255, 255, 0.95);
        }
        
        body { 
            font-family: 'Lora', serif; 
            color: var(--text-blue); 
            margin: 0; padding: 0; line-height: 1.7; scroll-behavior: smooth;
            /* Sfondo fotografico originale di alta qualità */
            background: linear-gradient(rgba(10, 61, 98, 0.45), rgba(10, 61, 98, 0.45)), url('https://images.unsplash.com/photo-1499678329028-101435549a4e?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed; 
            background-size: cover;
            min-height: 100vh;
        }

        h1, h2, h3, h4 {
            font-family: 'Playfair Display', serif;
            color: var(--primary-blue);
        }
        
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px rgba(10, 61, 98, 0.2);
            border-radius: 16px;
        }

        nav { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 15px 30px; position: sticky; top: 10px; z-index: 100; 
            margin: 0 20px; flex-wrap: wrap; gap: 15px;
        }
        
        .brand-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .brand-logo-text {
            font-family: 'Playfair Display', serif;
            font-size: 1.4em;
            font-weight: 700;
            color: var(--primary-blue);
            text-transform: uppercase;
            letter-spacing: 1px;
            text-decoration: none;
        }

        .brand-title-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .column-icon {
            font-size: 1.3em;
            color: var(--primary-blue);
            opacity: 0.95;
        }

        .brand-title-wrapper h2 { 
            margin: 0; letter-spacing: 2px; text-transform: uppercase; font-size: 1.2em; font-weight: 700; white-space: nowrap;
        }

        .nav-links { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
        nav a { 
            text-decoration: none; color: var(--primary-blue); font-weight: 600; 
            text-transform: uppercase; font-size: 0.85em; letter-spacing: 1px; transition: 0.3s; 
        }
        nav a:hover { opacity: 0.7; }
        
        .hero { 
            height: 70vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 0 20px;
        }
        .hero-title-container {
            display: flex;
            align-items: center;
            gap: 25px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .hero-column {
            width: 32px;
            height: 90px;
            fill: white;
            filter: drop-shadow(0 4px 12px rgba(10, 61, 98, 0.9));
        }
        .hero h1 { 
            font-size: 4.2em; margin: 0; letter-spacing: 4px; text-transform: uppercase; 
            color: white; text-shadow: 0 4px 15px rgba(10, 61, 98, 0.9); 
        }
        .hero p { 
            font-size: 1.4em; font-style: italic; color: white; text-shadow: 0 2px 10px rgba(10, 61, 98, 0.9); 
        }
        
        .section { padding: 60px 20px; max-width: 1200px; margin: 30px auto; }
        .section-title { text-align: center; font-size: 2.8em; margin-bottom: 15px; font-weight: 700; }
        .section-subtitle { text-align: center; font-size: 1.1em; margin-bottom: 40px; max-width: 800px; margin-left: auto; margin-right: auto; font-weight: 600; }
        
        .history-layout { display: flex; gap: 30px; align-items: stretch; margin-top: 20px; }
        .history-text { flex: 1; padding: 30px; font-size: 1.05em; font-weight: 500; text-align: justify; }
        .history-text h3 { font-size: 1.6em; margin-top: 0; margin-bottom: 15px; }
        
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
        .event-card { padding: 20px; transition: transform 0.3s; display: flex; flex-direction: column; }
        .event-card:hover { transform: translateY(-8px); }
        .event-content { display: flex; flex-direction: column; }
        .event-date { color: var(--primary-blue); font-weight: 700; font-size: 0.8em; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        .event-title { font-size: 1.25em; margin: 0 0 8px 0; font-weight: 700; }
        .event-desc { font-size: 0.9em; font-weight: 500; }

        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; margin-top: 30px; }
        .activity-card { text-align: center; padding: 35px 20px; transition: 0.3s; }
        .activity-card:hover { transform: translateY(-5px); }
        .activity-card h3 { font-size: 1.4em; margin-bottom: 10px; }
        .activity-card p { font-size: 0.95em; font-weight: 500; }
